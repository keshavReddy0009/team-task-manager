name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - run: cd team-task-manager/server && npm install
      - run: cd team-task-manager/client && npm install
      - run: cd team-task-manager/client && npm run build
